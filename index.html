<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#0E151C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light dark;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: tutto lo schermo è la zona di gioco. In alto i punteggi, sotto una griglia che occupa lo spazio libero.
   Si controlla toccando la parte dello schermo dove vuoi andare, oppure con lo swipe. Il pad a quattro zone è facoltativo. */
:root {
  --bg: #E6ECF0;
  --board: #F8FAFB;
  --grid: #C9D3DB;
  --line: #C3CED7;
  --ink: #14232F;
  --muted: #566774;
  --snake: #2C5B8A;
  --snake-head: #173B61;
  --food: #E8A317;
  --danger: #C8432B;
  --bonus: #7C4DDB;
  --slow: #14949B;
  --cut: #D9467A;
  --obst: #9FB0BD;
  --monster: #C8432B;
  --btn: #FFFFFF;
  --zone: #D3DEE6;
  --overlay: rgba(230, 236, 240, 0.92);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151C;
    --board: #15202A;
    --grid: #25343F;
    --line: #2E4150;
    --ink: #E7EEF3;
    --muted: #8DA0AE;
    --snake: #5E9BD6;
    --snake-head: #A8D0FA;
    --food: #F5B83D;
    --danger: #FF7A5C;
    --bonus: #B292FF;
    --slow: #4FD1D5;
    --cut: #FF7FA8;
    --obst: #3B4D5C;
    --monster: #FF7A5C;
    --btn: #1B2833;
    --zone: #2C4152;
    --overlay: rgba(14, 21, 28, 0.92);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C;
  --board: #15202A;
  --grid: #25343F;
  --line: #2E4150;
  --ink: #E7EEF3;
  --muted: #8DA0AE;
  --snake: #5E9BD6;
  --snake-head: #A8D0FA;
  --food: #F5B83D;
  --danger: #FF7A5C;
  --bonus: #B292FF;
  --slow: #4FD1D5;
  --cut: #FF7FA8;
  --obst: #3B4D5C;
  --monster: #FF7A5C;
  --btn: #1B2833;
  --zone: #2C4152;
  --overlay: rgba(14, 21, 28, 0.92);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: none;
}
.app {
  width: 100%;
  max-width: 520px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
header { flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.75rem;
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
}
.stats { display: flex; gap: 12px; margin-left: auto; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.stat span { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat b {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 1.35rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.board {
  position: relative;
  flex: none;
  border-radius: 18px;
  overflow: hidden;
  background: var(--board);
  box-shadow: 0 0 0 1px var(--line), 0 10px 30px -18px rgba(20, 35, 47, 0.45);
}
canvas { display: block; width: 100%; height: 100%; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px;
  text-align: center;
  background: var(--overlay);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.ov-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2rem;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
.ov-sub { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 28ch; text-wrap: balance; }
.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 14px;
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--muted);
}
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.ov-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }

.btn {
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 9px 14px;
  min-height: 40px;
  cursor: pointer;
  touch-action: manipulation;
  text-align: center;
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }

.pausebtn {
  flex: none;
  width: 40px;
  height: 40px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.pausebtn:disabled { opacity: 0.35; cursor: default; }
.pausebtn svg { width: 16px; height: 16px; }

/* Pad a quattro zone: solo su richiesta (pulsante "Pad" nella schermata di pausa) */
.pad {
  display: none;
  flex: none;
  position: relative;
  height: clamp(130px, 26dvh, 240px);
  border-radius: 22px;
  background: var(--btn);
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
  touch-action: none;
  cursor: pointer;
}
body.pad-on .pad { display: block; }
.z { position: absolute; inset: 0; background: var(--zone); opacity: 0; transition: opacity 0.08s; }
.z.on { opacity: 1; }
.z-up { clip-path: polygon(0 0, 100% 0, 50% 50%); }
.z-down { clip-path: polygon(0 100%, 100% 100%, 50% 50%); }
.z-left { clip-path: polygon(0 0, 0 100%, 50% 50%); }
.z-right { clip-path: polygon(100% 0, 100% 100%, 50% 50%); }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lines line { stroke: var(--line); stroke-width: 1.5; }
.arr { position: absolute; width: 34px; height: 34px; color: var(--ink); opacity: 0.8; pointer-events: none; }
.arr-up { top: 12px; left: 50%; transform: translateX(-50%); }
.arr-down { bottom: 12px; left: 50%; transform: translateX(-50%); }
.arr-left { left: 16px; top: 50%; transform: translateY(-50%); }
.arr-right { right: 16px; top: 50%; transform: translateY(-50%); }

.hint { display: none; flex: none; margin: 0; font-size: 0.82rem; color: var(--muted); text-align: center; }
button:focus-visible { outline: 2px solid var(--snake); outline-offset: 2px; }

.overlay { overflow-y: auto; justify-content: flex-start; touch-action: none; }
.ovin { margin: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chip {
  font: inherit; font-size: 0.78rem; font-weight: 700; padding: 8px 12px; min-height: 38px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--btn); color: var(--ink); cursor: pointer; touch-action: manipulation; white-space: nowrap;
}
.btn.play { background: var(--snake); color: var(--board); border-color: var(--snake); font-size: 1rem; padding: 12px 34px; margin: 4px 0; }
.chip.on { background: var(--snake); color: var(--board); border-color: var(--snake); }
.chip:disabled { opacity: 0.45; cursor: default; }
.mdesc { margin: 0; font-size: 0.8rem; color: var(--muted); text-align: center; max-width: 32ch; text-wrap: balance; }
.panel { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; background: var(--board); touch-action: pan-y; text-align: left; }
.panel[hidden] { display: none; }
.ph { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; }
.ph h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; }
.pb { touch-action: pan-y; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.skins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skin { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--btn); text-align: left; font: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; }
.skin.on { box-shadow: 0 0 0 2px var(--snake); }
.skin.lock { opacity: 0.6; cursor: default; }
.skin b { font-size: 0.9rem; }
.skin small { font-size: 0.72rem; color: var(--muted); line-height: 1.25; }
.sw { display: block; position: relative; height: 18px; margin-right: 14px; border-radius: 9px; background: var(--a); }
.sw::after { content: ""; position: absolute; right: -14px; top: -3px; width: 24px; height: 24px; border-radius: 50%; background: var(--b); }
.sw.rb { background: linear-gradient(90deg, #ff5e5e, #ffb347, #ffe94d, #4fd08f, #4fc3f7, #b292ff); }
.mis { padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--btn); display: flex; flex-direction: column; gap: 6px; }
.mis.done { border-color: var(--snake); }
.mis small { color: var(--muted); font-size: 0.75rem; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--snake); }
.lbrow { display: flex; gap: 10px; align-items: baseline; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.lbrow.me { font-weight: 800; color: var(--snake); }
.lbrow .n { width: 1.6em; color: var(--muted); font-family: var(--font-mono); }
.lbrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbrow .sc { font-family: var(--font-mono); }
.nick { display: flex; gap: 8px; }
.nick input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--btn); color: var(--ink); -webkit-user-select: text; user-select: text; }
.pnote { margin: 0; font-size: 0.78rem; color: var(--muted); }

@media (pointer: fine) {
  body.pad-on .pad { display: none; }
  .hint { display: block; }
}
</style>
</head>
<body>

<main class="app" id="app">
  <header>
    <h1>Snake</h1>
    <div class="stats">
      <div class="stat"><span>Livello</span><b id="level">1</b></div>
      <div class="stat"><span>Punti</span><b id="score">0</b></div>
      <div class="stat"><span>Record</span><b id="best">0</b></div>
    </div>
    <button class="pausebtn" id="pauseBtn" type="button" aria-label="Pausa" disabled>
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3.4" height="12" rx="1"/><rect x="9.6" y="2" width="3.4" height="12" rx="1"/></svg>
    </button>
  </header>

  <div class="stage" id="stage">
    <div class="board" id="board" aria-label="Griglia di gioco">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay">
        <div class="ovin">
          <p class="ov-title" id="ovTitle">Pronto?</p>
          <p class="ov-sub" id="ovSub">Tocca lo schermo per iniziare</p>
          <button class="btn play" id="playBtn" type="button">Gioca</button>
          <div class="seg" id="modeSeg"></div>
          <p class="mdesc" id="modeDesc"></p>
          <div class="ov-tools">
            <button class="btn" id="skinBtn" type="button">Skin</button>
            <button class="btn" id="misBtn" type="button">Missioni</button>
            <button class="btn" id="lbBtn" type="button">Classifica</button>
          </div>
          <div class="ov-tools">
            <button class="btn" id="musicBtn" type="button">Musica: sì</button>
            <button class="btn" id="soundBtn" type="button">Effetti: sì</button>
            <button class="btn" id="padBtn" type="button">Pad: no</button>
            <button class="btn" id="fsBtn" type="button" hidden>Schermo intero</button>
          </div>
          <div class="legend" aria-hidden="true">
            <span><i style="background:var(--food)"></i>Mela +10</span>
            <span><i style="background:var(--bonus)"></i>Stella +50</span>
            <span><i style="background:var(--slow)"></i>Rallenta</span>
            <span><i style="background:var(--cut)"></i>Accorcia</span>
            <span><i style="background:var(--monster)"></i>Mostri dal livello 5</span>
          </div>
        </div>
        <div class="panel" id="panel" hidden></div>
      </div>
    </div>
  </div>
  <p class="hint">Frecce o WASD per muoverti, spazio per la pausa. Ogni 5 cibi sale il livello.</p>

  <div class="pad" id="pad" aria-label="Comandi: tocca sopra, sotto, a sinistra o a destra">
    <div class="z z-up" id="zUp"></div>
    <div class="z z-down" id="zDown"></div>
    <div class="z z-left" id="zLeft"></div>
    <div class="z z-right" id="zRight"></div>
    <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"/>
      <line x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="arr arr-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    <svg class="arr arr-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    <svg class="arr arr-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <svg class="arr arr-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</main>

<script>
(function () {
  'use strict';
  var COLS = 20, ROWS = 20;           // la griglia si adatta allo schermo (colonne fisse, righe in base all'altezza)
  var MIN_ROWS = 16, MAX_ROWS = 40;
  var FOODS_PER_LEVEL = 5;
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), canvas = $('cv'), ctx = canvas.getContext('2d', { alpha: false });
  var scoreEl = $('score'), bestEl = $('best'), levelEl = $('level');
  var overlay = $('overlay'), ovTitle = $('ovTitle'), ovSub = $('ovSub');
  var pauseBtn = $('pauseBtn'), soundBtn = $('soundBtn'), musicBtn = $('musicBtn'), padBtn = $('padBtn'), fsBtn = $('fsBtn');
  var playBtn = $('playBtn'), skinBtn = $('skinBtn'), misBtn = $('misBtn'), lbBtn = $('lbBtn'), modeSeg = $('modeSeg'), modeDesc = $('modeDesc');
  var rootEl = document.documentElement;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Schermo intero ---------- */
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  var standalone = (window.matchMedia && (window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches)) || window.navigator.standalone === true;
  var canFs = !!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen);
  fsBtn.hidden = !canFs || standalone;
  fsBtn.addEventListener('click', function () {
    if (fsEl()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var req = rootEl.requestFullscreen || rootEl.webkitRequestFullscreen;
      var p = req.call(rootEl);
      if (p && p.catch) p.catch(function () {});
    }
  });
  function onFs() {
    fsBtn.textContent = fsEl() ? 'Riduci' : 'Schermo intero';
    setTimeout(resize, 60);
  }
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);

  /* ---------- Colori (letti una volta e quando cambia il tema) ---------- */
  var C = {};
  function loadColors() {
    var cs = getComputedStyle(document.documentElement);
    ['board', 'grid', 'snake', 'snake-head', 'food', 'danger', 'bonus', 'slow', 'cut', 'obst', 'monster', 'ink', 'muted'].forEach(function (n) {
      C[n] = cs.getPropertyValue('--' + n).trim();
    });
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { loadColors(); buildGrid(); });
  }

  /* ---------- Suoni (WebAudio, nessun file) ---------- */
  var actx = null, muted = false;
  function audio() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function tone(f1, f2, dur, type, vol, delay) {
    if (muted || !actx) return;
    try {
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f1, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  var SFX = {
    eat: function () { tone(520, 840, 0.11, 'sine', 0.14); },
    bonus: function () { tone(784, 0, 0.1, 'triangle', 0.12); tone(988, 0, 0.1, 'triangle', 0.11, 0.09); tone(1319, 0, 0.2, 'triangle', 0.11, 0.18); },
    slow: function () { tone(720, 220, 0.4, 'sine', 0.13); },
    cut: function () { tone(520, 170, 0.2, 'triangle', 0.13); },
    level: function () { tone(523, 0, 0.12, 'sine', 0.12); tone(659, 0, 0.12, 'sine', 0.12, 0.11); tone(784, 0, 0.2, 'sine', 0.12, 0.22); },
    die: function () { tone(300, 60, 0.45, 'sawtooth', 0.09); },
    spawn: function () { tone(200, 110, 0.3, 'square', 0.05); }
  };
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  /* ---------- Stato di gioco ---------- */
  var cell = 17, BW = 340, BH = 340, dpr = 1;
  var snake, prevSnake, dir, queue, food, special, obstacles;
  var score = 0, best = 0, level = 1, eaten = 0;
  var state = 'ready'; // ready | running | paused | over
  var prog = 0, alpha = 1, slowF = 1, mProg = 0, powerUntil = 0, gt = 0, overAt = 0, crashed = false, won = false, wrap = false, padOn = false;
  var slowUntil = 0, bannerAt = -9999, bannerText = '', bannerSub = '', shakeUntil = 0;
  var timeLeft = 0, endReason = '', newBest = false, newSkins = [], snapOk = [];
  var particles = [], monsters = [], respawns = [];
  var MONSTER_SLOW = 1.9, MAX_MONSTERS = 3;

  /* ---------- Modalità, statistiche e preferenze ---------- */
  var MODES = [
    { id: 'classic', name: 'Classica', desc: 'Livelli, ostacoli e mostri. Contro i muri si perde.', wrap: false },
    { id: 'timed', name: 'A tempo', desc: '90 secondi: ogni mela dà 2 secondi in più. Fai più punti che puoi.', wrap: false, time: 90000 },
    { id: 'turbo', name: 'Turbo', desc: 'Niente ostacoli né mostri: la velocità cresce a ogni mela.', wrap: false },
    { id: 'open', name: 'Senza muri', desc: 'I bordi sono aperti: esci da un lato e rientri dall\u2019altro.', wrap: true }
  ];
  function modeOf(id) { for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i]; return null; }

    for (var y = 0; y < ROWS; y++) {

  function pick(list) { return list.length ? list[Math.floor(Math.random() * list.length)] : null; }

    if (special || Math.random() > 0.3) return;
    var r = Math.random();
    var type = r < 0.5 ? 'gold' : (r < 0.75 ? 'slow' : 'cut');
    var c = pick(freeCells());
    if (!c) return;

  }

  function addObstacles(n) {
    for (var k = 0; k < n && obstacles.length < 18; k++) {

      var c = pick(freeCells(function (x, y) {
        if (Math.abs(x - h.x) + Math.abs(y - h.y) < 6) return false;
        var j, o;
        for (j = 0; j < obstacles.length; j++) {
          o = obstacles[j];
          if (Math.max(Math.abs(o.x - x), Math.abs(o.y - y)) < 2) return false;
        }
        if (food && Math.max(Math.abs(food.x - x), Math.abs(food.y - y)) < 2) return false;
        if (special && Math.max(Math.abs(special.x - x), Math.abs(special.y - y)) < 2) return false;
        return true;

    }
  }

  function reset() {

    mProg = 0;

    slowF = 1;
    gt = 0;

    powerUntil = 0;
    bannerSub = '';
    bannerAt = -9999;
    shakeUntil = 0;
    crashed = false;
    won = false;
    wrap = modeOf(mode).wrap;
    timeLeft = modeOf(mode).time || 0;

    newSkins = [];
    best = bests[mode] || 0;

    state = 'ready';

  }

  function start() {

  function pause() {

  }
  function resume() {

    closePanel();

    musicStart();

  function burst(cx, cy, color, n, speed) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = (0.4 + Math.random() * 0.9) * speed;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 380 + Math.random() * 320, color: color, r: 0.1 + Math.random() * 0.1 });
    }
  }
  function floatText(cx, cy, text, color) {

  }

  function recordGame() {
    stats.games++;

    missionEvent('games', 1);
    missionEvent('score', score, true);
    missionEvent('level', level, true);
    if (mode === 'timed') missionEvent('timed', score, true);
    newBest = score > 0 && score > (bests[mode] || 0);
    if (newBest) {

      best = score;
      lsSet('snake.bests', JSON.stringify(bests));
    }
    pushLocal(mode, score, level);
    saveStats();
    newSkins = [];
    SKINS.forEach(function (s, i) { if (skinOk(s) && !snapOk[i]) newSkins.push(s.name); });
    if (score > 0) submitScore(mode, score, level);
  }

  function gameOver(didWin, reason) {
    state = 'over';
    won = !!didWin;
    endReason = reason || '';

    overAt = performance.now();
    alpha = 1;
    musicStop();
    recordGame();
    if (crashed) {
      var h = snake[0];
      burst(h.x + 0.5, h.y + 0.5, C.danger, 18, 0.006);
      if (!reduceMotion) shakeUntil = performance.now() + 320;
      SFX.die();
      buzz(70);
    } else if (endReason === 'time') {

    }
    refreshUI();
  }

  function primary() {
    audio();

    else if (state === 'paused') resume();
    else if (state === 'over' && performance.now() - overAt > 400) { reset(); start(); }
  }

  function setDir(dx, dy) {
    audio();

      start();

      return;

    if (dx === -last.x && dy === -last.y) return;
    if (queue.length < 3) queue.push({ x: dx, y: dy });
  }

  function levelUp() {

    if (mode !== 'turbo') {

      syncMonsters();
    }
  }

  /* ---------- Mostri: dal livello 5 ti cercano; con la stella puoi mangiarli ---------- */
  function monsterActive(m) { return gt - m.born >= 900; }
  function monsterAt(x, y) {

  function spawnMonster() {

    SFX.spawn();
    return true;
  }
  function syncMonsters() {
    var want = (level >= 5 && mode !== 'turbo') ? Math.min(MAX_MONSTERS, 1 + Math.floor((level - 5) / 2)) : 0;

  }
  function respawnTick() {

    }
  }
  function eatMonster(i) {

    missionEvent('monsters', 1);
    burst(m.x + 0.5, m.y + 0.5, C.monster, 16, 0.0075);
    floatText(m.x + 0.5, m.y + 0.2, '+100', C.monster);
    SFX.bonus();
    buzz(20);
    refreshUI();
  }
  var DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function nbrs(x, y) {
    var out = [];
    for (var i = 0; i < 4; i++) {

  }

    var h = snake[0], scared = powerUntil > gt;
    for (var i = monsters.length - 1; i >= 0; i--) {

      m.px = m.x;
      m.py = m.y;

      var nx = scared ? fleeStep(m) : (Math.random() < 0.12 ? randomStep(m) : chaseStep(m));
      if (nx) { m.x = nx.x; m.y = nx.y; }

        else { gameOver(false); return; }
      }
    }
  }

  function step() {

      hy = (hy + ROWS) % ROWS;
    } else if (hx < 0 || hy < 0 || hx >= COLS || hy >= ROWS) {
      gameOver(false);
      return;
    }
    var i;
    for (i = 0; i < obstacles.length; i++) {
      if (obstacles[i].x === hx && obstacles[i].y === hy) { gameOver(false); return; }
    }
    var mi = monsterAt(hx, hy);
    if (mi >= 0) {
      if (powerUntil > gt) eatMonster(mi);
      else { gameOver(false); return; }
    }
    var eatingFood = food && hx === food.x && hy === food.y;
    var eatingSpecial = special && hx === special.x && hy === special.y;
    var grow = eatingFood;
    var body = grow ? snake : snake.slice(0, -1);
    for (i = 0; i < body.length; i++) {
      if (body[i].x === hx && body[i].y === hy) { gameOver(false); return; }
    }

    prevSnake = snake.slice();
    snake.unshift({ x: hx, y: hy });
    if (!grow) snake.pop();

    if (eatingSpecial) {
      var sp = special;
      special = null;
      if (sp.type === 'gold') {
        score += 50;
        stats.stars++;
        missionEvent('stars', 1);
        powerUntil = gt + 5000;
        burst(hx + 0.5, hy + 0.5, C.bonus, 16, 0.0075);
        floatText(hx + 0.5, hy + 0.2, '+50', C.bonus);
        SFX.bonus();
        buzz([15, 40, 15]);
      } else if (sp.type === 'slow') {
        score += 10;
        slowUntil = gt + 5000;
        burst(hx + 0.5, hy + 0.5, C.slow, 14, 0.006);
        floatText(hx + 0.5, hy + 0.2, 'Rallenta', C.slow);
        SFX.slow();
        buzz(20);
      } else {
        score += 10;
        var k = Math.min(3, snake.length - 3);
        if (k > 0) snake.length = snake.length - k;
        burst(hx + 0.5, hy + 0.5, C.cut, 14, 0.006);
        floatText(hx + 0.5, hy + 0.2, 'Accorcia', C.cut);
        SFX.cut();
        buzz(20);
      }
    }

    if (eatingFood) {
      score += 10;
      eaten++;
      stats.apples++;
      missionEvent('apples', 1);
      if (modeOf(mode).time) timeLeft = Math.min(timeLeft + 2000, 150000);
      burst(hx + 0.5, hy + 0.5, C.food, 10, 0.0055);
      floatText(hx + 0.5, hy + 0.2, '+10', C.food);
      SFX.eat();
      buzz(12);
      if (eaten % FOODS_PER_LEVEL === 0) levelUp();
      if (snake.length + obstacles.length >= COLS * ROWS) { food = null; refreshUI(); gameOver(true); return; }
      placeFood();
      maybeSpawnSpecial();
      refreshUI();
    }
  }

  function fmtTime(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function refreshUI() {
    scoreEl.textContent = score;
    bestEl.textContent = Math.max(best, score);
    levelEl.textContent = level;
    pauseBtn.disabled = state !== 'running';
    var idle = state === 'ready' || state === 'over';
    padBtn.disabled = !idle;
    soundBtn.textContent = muted ? 'Effetti: no' : 'Effetti: sì';
    musicBtn.textContent = musicOn ? 'Musica: sì' : 'Musica: no';
    padBtn.textContent = padOn ? 'Pad: sì' : 'Pad: no';
    each4(modeSeg.children, function (b) {
      var on = b.getAttribute('data-mode') === mode;
      b.classList.toggle('on', on);
      b.disabled = !idle;
    });
    modeDesc.textContent = modeOf(mode).desc;
    overlay.hidden = state === 'running';
    overlay.style.touchAction = overlay.scrollHeight > overlay.clientHeight + 2 ? 'pan-y' : 'none';
    playBtn.textContent = state === 'paused' ? 'Riprendi' : (state === 'over' ? 'Rigioca' : 'Gioca');
    if (state === 'ready') {
      ovTitle.textContent = 'Pronto?';
      ovSub.textContent = 'Tocca lo schermo per iniziare. Tocca dove vuoi andare, o scorri il dito';
    } else if (state === 'paused') {
      ovTitle.textContent = 'In pausa';
      ovSub.textContent = 'Tocca lo schermo per riprendere';
    } else if (state === 'over') {
      ovTitle.textContent = endReason === 'time' ? 'Tempo scaduto!' : (won ? 'Hai vinto!' : 'Fine partita');
      ovSub.textContent = 'Livello ' + level + ', ' + score + ' punti. ' + (newBest ? 'Nuovo record!' : 'Record: ' + best + '.') +
        (newSkins.length ? ' Nuova skin: ' + newSkins.join(', ') + '.' : '') + ' Tocca per rigiocare.';
    }
  }
  function each4(list, fn) { for (var i = 0; i < list.length; i++) fn(list[i]); }

  /* ---------- Disegno ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function visPos(i, a) {
    var o = prevSnake[Math.min(i, prevSnake.length - 1)], p = snake[i];
    if (Math.abs(p.x - o.x) > 1.5 || Math.abs(p.y - o.y) > 1.5) return a < 0.5 ? { x: o.x, y: o.y } : { x: p.x, y: p.y };
    return { x: o.x + (p.x - o.x) * a, y: o.y + (p.y - o.y) * a };
  }

  // Tratto morbido: curve che passano per i punti medi, così le svolte sono arrotondate
  function strokeRun(run) {

    ctx.beginPath();
    ctx.moveTo(run[0].x, run[0].y);
    for (var i = 1; i < run.length - 1; i++) {
      ctx.quadraticCurveTo(run[i].x, run[i].y, (run[i].x + run[i + 1].x) / 2, (run[i].y + run[i + 1].y) / 2);
    }
    ctx.lineTo(run[run.length - 1].x, run[run.length - 1].y);
    ctx.stroke();
  }

  function drawStar(cx, cy, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 ? r * 0.46 : r;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawSpecial(t, c) {
    if (!special) return;
    var left = special.life - (gt - special.born);
    if (left < 1600 && Math.floor(t / 140) % 2 === 0) return;
    var cx = special.x * c + c / 2, cy = special.y * c + c / 2;
    var pulse = reduceMotion ? 1 : 1 + Math.sin(t / 200) * 0.07;
    var col = special.type === 'gold' ? C.bonus : (special.type === 'slow' ? C.slow : C.cut);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.5, c * 0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, c * 0.46, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, left / special.life));

      ctx.beginPath();
      ctx.arc(cx, cy, c * 0.3 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = C.board;
      ctx.lineWidth = Math.max(1.6, c * 0.09);
      ctx.beginPath();
      ctx.moveTo(cx - c * 0.15, cy);
      ctx.lineTo(cx + c * 0.15, cy);
      ctx.stroke();

  function drawMonster(m, c, t) {

    ctx.moveTo(cx + c * 0.3, cy - c * 0.22); ctx.lineTo(cx + c * 0.2, cy - c * 0.46); ctx.lineTo(cx + c * 0.07, cy - c * 0.28);

  function drawPill(label, color, row) {

    ctx.fill();
    ctx.fillStyle = C.board;
    ctx.fillText(label, c * 0.4 + c * 0.35, y0 + c * 0.45);
  }

  function draw(t) {
    var c = cell, i, j;
    var a = state === 'over' ? 1 : alpha;
    var sx = 0, sy = 0;
    if (t < shakeUntil) {
      var m = (shakeUntil - t) / 320 * c * 0.25;
      sx = (Math.random() - 0.5) * 2 * m;
      sy = (Math.random() - 0.5) * 2 * m;
    }
    ctx.setTransform(dpr, 0, 0, dpr, sx * dpr, sy * dpr);
    ctx.drawImage(gridCv, 0, 0, BW, BH);          // sfondo e punti già pronti (nessun ridisegno)

    // ostacoli
    ctx.fillStyle = C.obst;
    var oi = Math.max(1, c * 0.1);
    for (j = 0; j < obstacles.length; j++) {
      rr(obstacles[j].x * c + oi, obstacles[j].y * c + oi, c - oi * 2, c - oi * 2, c * 0.24);
      ctx.fill();
    }

    // cibo
    if (food) {
      var pulse = reduceMotion ? 0 : Math.sin(t / 220) * c * 0.035;
      var fx = food.x * c + c / 2, fy = food.y * c + c / 2;
      ctx.fillStyle = C.food;
      ctx.beginPath();
      ctx.arc(fx, fy, c * 0.3 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(fx - c * 0.09, fy - c * 0.1, c * 0.07, 0, Math.PI * 2);
      ctx.fill();
    }
    drawSpecial(t, c);
    for (j = 0; j < monsters.length; j++) drawMonster(monsters[j], c, t);

    // serpente: un unico tratto curvo; ombra con un semplice scarto (niente sfocature costose)
    var pts = [];
    for (i = 0; i < snake.length; i++) {
      var v = visPos(i, a);
      pts.push({ x: v.x * c + c / 2, y: v.y * c + c / 2 });
    }
    var runs = [], run = [pts[0]];
    for (i = 1; i < pts.length; i++) {
      if (Math.abs(pts[i].x - pts[i - 1].x) > c * 1.5 || Math.abs(pts[i].y - pts[i - 1].y) > c * 1.5) { runs.push(run); run = []; }
      run.push(pts[i]);
    }
    runs.push(run);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = c * 0.7;
    ctx.save();
    ctx.translate(0, c * 0.09);
    ctx.strokeStyle = 'rgba(10, 25, 40, 0.16)';
    for (j = 0; j < runs.length; j++) strokeRun(runs[j]);
    ctx.restore();
    var sk = activeSkin(), scol = skinCols(sk), bodyCol = scol ? scol[0] : C.snake, headCol = scol ? scol[1] : C['snake-head'];
    if (sk.rainbow) {
      var tl = pts[pts.length - 1], gx = tl.x - pts[0].x, gy = tl.y - pts[0].y, gl = Math.hypot(gx, gy) || 1, span = Math.max(gl, c * 5);
      var gr = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[0].x + gx / gl * span, pts[0].y + gy / gl * span);
      for (var gi = 0; gi <= 4; gi++) gr.addColorStop(gi / 4, 'hsl(' + Math.round((t / 14 + gi * 70) % 360) + ',85%,' + (isDark() ? 62 : 52) + '%)');
      bodyCol = gr;
      headCol = 'hsl(' + Math.round((t / 14 - 40 + 360) % 360) + ',85%,' + (isDark() ? 70 : 40) + '%)';
    }
    ctx.strokeStyle = bodyCol;
    for (j = 0; j < runs.length; j++) strokeRun(runs[j]);

    // testa: gira piano insieme al corpo
    var hp = pts[0], fdx = dir.x, fdy = dir.y;
    if (pts.length > 1) {
      var vx = hp.x - pts[1].x, vy = hp.y - pts[1].y, vl = Math.hypot(vx, vy);
      if (vl > c * 0.05 && vl < c * 1.5) { fdx = vx / vl; fdy = vy / vl; }
    }
    headX = hp.x;
    headY = hp.y;
    ctx.fillStyle = crashed ? C.danger : headCol;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, c * 0.42, 0, Math.PI * 2);
    ctx.fill();
    var px = -fdy, py = fdx;
    for (var k = -1; k <= 1; k += 2) {
      var ex = hp.x + fdx * c * 0.14 + px * k * c * 0.17;
      var ey = hp.y + fdy * c * 0.14 + py * k * c * 0.17;
      ctx.fillStyle = C.board;
      ctx.beginPath();
      ctx.arc(ex, ey, c * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.ink;
      ctx.beginPath();
      ctx.arc(ex + fdx * c * 0.03, ey + fdy * c * 0.03, c * 0.05, 0, Math.PI * 2);
      ctx.fill();
    }

    // particelle e scritte
    for (i = 0; i < particles.length; i++) {
      var p = particles[i], f = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, f);
      if (p.text) {
        ctx.fillStyle = p.color;
        ctx.font = '700 ' + Math.round(c * 0.5) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x * c, p.y * c);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x * c, p.y * c, p.r * c * (0.4 + f * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // effetti attivi
    var row = 0;
    if (slowUntil > gt && state !== 'ready') drawPill('Rallentato ' + Math.ceil((slowUntil - gt) / 1000) + 's', C.slow, row++);
    if (powerUntil > gt && state !== 'ready') drawPill('Potere ' + Math.ceil((powerUntil - gt) / 1000) + 's', C.bonus, row++);
    if (modeOf(mode).time && state !== 'ready') drawPill('Tempo ' + fmtTime(timeLeft), timeLeft < 10000 ? C.danger : C.snake, row++);

    // banner di livello
    var bt = t - bannerAt;
    if (bt >= 0 && bt < 1400) {
      var fade = bt < 200 ? bt / 200 : (bt > 1000 ? 1 - (bt - 1000) / 400 : 1);
      ctx.globalAlpha = Math.max(0, fade);
      ctx.font = '800 ' + Math.round(c * 1.3) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = c * 0.35;
      ctx.strokeStyle = C.board;
      ctx.strokeText(bannerText, BW / 2, BH * 0.3);
      ctx.fillStyle = C.ink;
      ctx.fillText(bannerText, BW / 2, BH * 0.3);
      if (bannerSub) {
        ctx.font = '700 ' + Math.round(c * 0.6) + 'px system-ui, sans-serif';
        ctx.lineWidth = c * 0.3;
        ctx.strokeText(bannerSub, BW / 2, BH * 0.3 + c * 1.3);
        ctx.fillStyle = C.monster;
        ctx.fillText(bannerSub, BW / 2, BH * 0.3 + c * 1.3);
      }
      ctx.globalAlpha = 1;
    }
  }

  var lastFrame = 0, drawMs = 0;
  function frame(t) {
    var dt = Math.min(50, t - (lastFrame || t));
    lastFrame = t;
    if (state === 'running') {
      gt += dt;
      if (modeOf(mode).time) {
        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; gameOver(false, 'time'); }
      }
      // la velocità cambia in modo dolce, e l'avanzamento è un numero continuo: niente scatti quando cambia livello o effetto
      slowF += ((slowUntil > gt ? 1.65 : 1) - slowF) * Math.min(1, dt / 200);
      var tm = baseTick() * slowF;
      prog += dt / tm;
      if (prog > 3) prog = 3;
      while (prog >= 1 && state === 'running') { step(); prog -= 1; }
      alpha = Math.min(1, prog);
      if (monsters.length || respawns.length) {
        mProg += dt / (tm * MONSTER_SLOW);
        if (mProg > 3) mProg = 3;
        while (mProg >= 1 && state === 'running') { monstersStep(); mProg -= 1; }
        respawnTick();
      }
      if (special && gt - special.born > special.life) special = null;
    }
    if (state !== 'paused') {
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.life += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life >= p.max) particles.splice(i, 1);
      }
    }
    var t0 = performance.now();
    draw(t);
    drawMs = drawMs * 0.95 + (performance.now() - t0) * 0.05;
    requestAnimationFrame(frame);
  }

  /* ---------- Comandi su tutto lo schermo ---------- */
  // Tocco: lo snake va verso la parte dello schermo toccata, rispetto alla testa.
  // Swipe: scorri il dito nella direzione voluta. Niente viene disegnato a schermo.
  var FOLLOW_R = 38, DEAD = 12, HOLD_MS = 110;
  var fAct = false, ax = 0, ay = 0, fx0 = 0, fy0 = 0, fMoved = false, fDir = '', steered = false, holdT = 0;
  var headX = 0, headY = 0;
  function isUI(el) { return el && el.closest && el.closest('button, .pad, .panel, input'); }
  function sgn(v, fallback) { return v > 0 ? 1 : (v < 0 ? -1 : fallback); }

  function touchSteer(cx, cy) {
    var r = board.getBoundingClientRect();
    var dx = cx - (r.left + headX), dy = cy - (r.top + headY);
    if (Math.hypot(dx, dy) < cell * 0.5) return;
    var cur = queue.length ? queue[queue.length - 1] : dir;
    var horiz = Math.abs(dx) >= Math.abs(dy);
    var nx = horiz ? sgn(dx, 1) : 0, ny = horiz ? 0 : sgn(dy, 1);
    if (nx === -cur.x && ny === -cur.y) {        // tocco dietro la testa: svolta di lato, verso il tocco
      if (horiz) { nx = 0; ny = sgn(dy, headY < BH / 2 ? 1 : -1); }
      else { ny = 0; nx = sgn(dx, headX < BW / 2 ? 1 : -1); }
    }
    setDir(nx, ny);
  }

  var fSoft = false;
  document.addEventListener('pointerdown', function (e) {
    var ui = isUI(e.target);
    // nei menu uno swipe che parte anche sopra un pulsante fa partire la partita; il semplice tocco resta del pulsante
    fSoft = !!ui && (state === 'ready' || state === 'over') && !(e.target.closest && e.target.closest('.panel, input, .pad'));
    if (ui && !fSoft) return;
    if (!fSoft) e.preventDefault();
    fAct = true;
    fMoved = false;
    steered = false;
    fDir = '';
    ax = fx0 = e.clientX;
    ay = fy0 = e.clientY;
    clearTimeout(holdT);
    if (!fSoft) {
      holdT = setTimeout(function () {           // dito appoggiato: si sterza subito, senza aspettare che lo alzi
        if (fAct && !fMoved && (state === 'running' || state === 'ready')) { steered = true; touchSteer(fx0, fy0); }
      }, HOLD_MS);
      try { document.body.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  document.addEventListener('pointermove', function (e) {
    if (!fAct) return;
    var dx = e.clientX - ax, dy = e.clientY - ay, len = Math.hypot(dx, dy);
    if (len > FOLLOW_R) {                        // il punto di partenza segue il dito: i cambi di direzione restano immediati
      var k = (len - FOLLOW_R) / len;
      ax += dx * k;
      ay += dy * k;
      dx = e.clientX - ax;
      dy = e.clientY - ay;
      len = Math.hypot(dx, dy);
    }
    if (len < DEAD) return;
    clearTimeout(holdT);
    var d = '';
    if (Math.abs(dx) > Math.abs(dy) * 1.15) d = dx > 0 ? 'r' : 'l';
    else if (Math.abs(dy) > Math.abs(dx) * 1.15) d = dy > 0 ? 'd' : 'u';
    if (d && d !== fDir) {
      fDir = d;
      fMoved = true;
      setDir(d === 'r' ? 1 : (d === 'l' ? -1 : 0), d === 'd' ? 1 : (d === 'u' ? -1 : 0));
    }
  });
  function endGesture(e) {
    if (!fAct) return;
    fAct = false;
    clearTimeout(holdT);
    if (!fSoft && e.type === 'pointerup' && !fMoved && !steered && Math.hypot(e.clientX - fx0, e.clientY - fy0) < 10) {
      if (state === 'paused' || state === 'over') primary();
      else touchSteer(e.clientX, e.clientY);
    }
  }
  document.addEventListener('pointerup', endGesture);
  document.addEventListener('pointercancel', endGesture);

  /* ---------- Pad a quattro zone (facoltativo) ---------- */
  var pad = $('pad');
  var zoneEls = { up: $('zUp'), down: $('zDown'), left: $('zLeft'), right: $('zRight') };
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var padActive = false, padZone = null;

  function zoneAt(e) {
    var r = pad.getBoundingClientRect();
    var nx = (e.clientX - r.left) / r.width - 0.5;
    var ny = (e.clientY - r.top) / r.height - 0.5;
    if (Math.abs(nx) > Math.abs(ny)) return nx > 0 ? 'right' : 'left';
    return ny > 0 ? 'down' : 'up';
  }
  function lightZone(name) {
    for (var k in zoneEls) zoneEls[k].classList.toggle('on', k === name);
  }
  function hitPad(e, first) {
    var z = zoneAt(e);
    if (z === padZone && !first) return;
    padZone = z;
    lightZone(z);
    setDir(DIRS[z][0], DIRS[z][1]);
  }
  function endPad() {
    padActive = false;
    padZone = null;
    lightZone(null);
  }
  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    padActive = true;
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    hitPad(e, true);
  });
  pad.addEventListener('pointermove', function (e) {
    if (padActive) hitPad(e, false);
  });
  pad.addEventListener('pointerup', endPad);
  pad.addEventListener('pointercancel', endPad);

  function applyPad() {
    document.body.classList.toggle('pad-on', padOn);
    refreshUI();
    resize();
  }

  pauseBtn.addEventListener('click', function () {
    if (state === 'running') pause();
  });
  soundBtn.addEventListener('click', function () {
    muted = !muted;
    lsSet('snake.mute', muted ? '1' : '0');
    audio();
    if (!muted) SFX.eat();
    refreshUI();
  });
  musicBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    lsSet('snake.music', musicOn ? '1' : '0');
    audio();
    if (musicOn && state === 'running') musicStart(); else musicStop();
    refreshUI();
  });
  playBtn.addEventListener('click', function () { primary(); });
  skinBtn.addEventListener('click', function () { openPanel('skin'); });
  misBtn.addEventListener('click', function () { openPanel('mis'); });
  lbBtn.addEventListener('click', function () { lbMode = mode; openPanel('lb'); });
  (function buildModes() {
    modeSeg.innerHTML = MODES.map(function (m) { return '<button class="chip" type="button" data-mode="' + m.id + '">' + m.name + '</button>'; }).join('');
    modeSeg.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-mode]') : null;
      if (!b || b.disabled) return;
      mode = b.getAttribute('data-mode');
      lsSet('snake.mode', mode);
      reset();
    });
  })();
  padBtn.addEventListener('click', function () {
    padOn = !padOn;
    try { localStorage.setItem('snake.pad', padOn ? '1' : '0'); } catch (e) {}
    applyPad();
  });

  /* ---------- Tastiera ---------- */
  var keys = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };
  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (keys[e.key]) {
      e.preventDefault();
      setDir(keys[e.key][0], keys[e.key][1]);
    } else if (e.key === ' ' || e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      if (state === 'running') pause();
      else primary();
    } else if (e.key === 'p' || e.key === 'P') {
      if (state === 'running') pause();
      else if (state === 'paused') resume();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));

  // Aggancio per i test automatici (attivo solo con #test nell'indirizzo)
  if (location.hash === '#test') {
    window.__snake = {
      get: function () { return { state: state, score: score, level: level, eaten: eaten, len: snake.length, head: snake[0], dir: dir, special: special, obstacles: obstacles.length, food: food, slow: slowUntil > gt, power: powerUntil > gt, cols: COLS, rows: ROWS, cell: cell, drawMs: drawMs, headPx: [headX, headY], monsters: monsters.map(function (m) { return { x: m.x, y: m.y, active: monsterActive(m) }; }), respawns: respawns.length }; },
      setFood: function (x, y) { food = { x: x, y: y }; },
      setSpecial: function (type, x, y) { special = { type: type, x: x, y: y, born: gt, life: 60000 }; },
      setEaten: function (n) { eaten = n; },
      grow: function (n) { for (var i = 0; i < n; i++) snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y }); },
      forceLevel: function (n) { level = n; syncMonsters(); refreshUI(); },
      addMonster: function (x, y) { monsters.push({ x: x, y: y, px: x, py: y, born: gt - 2000 }); },
      setPower: function (ms) { powerUntil = gt + ms; },
      stepMonsters: function () { monstersStep(); },
      stats: function () { return JSON.parse(JSON.stringify(stats)); },
      daily: function () { return JSON.parse(JSON.stringify(daily)); },
      timeLeft: function () { return timeLeft; },
      setTime: function (ms) { timeLeft = ms; },
      mode: function () { return mode; },
      skin: function () { return activeSkin().id; },
      setStats: function (o) { for (var k in o) stats[k] = o[k]; },
      renderMusic: function (sec) {
        var oc = new OfflineAudioContext(1, 44100 * sec, 44100), g = oc.createGain(), t = 0, n = 0;
        g.gain.value = MUSIC_VOL; g.connect(oc.destination);
        while (t < sec) { mstepSched(oc, g, n, t, 100); t += 30 / 100; n++; }
        return oc.startRendering().then(function (buf) {
          var d = buf.getChannelData(0), pk = 0, ss = 0;
          for (var i = 0; i < d.length; i++) { var v = Math.abs(d[i]); if (v > pk) pk = v; ss += d[i] * d[i]; }
          return { peak: pk, rms: Math.sqrt(ss / d.length) };
        });
      }
    };
  }

  loadColors();
  document.body.classList.toggle('pad-on', padOn);
  reset();
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
