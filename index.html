<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#0E151C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light dark;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: schermo intero da telefono. In alto punteggi, al centro la griglia, in basso un pad grande diviso in quattro zone (sopra, sotto, sinistra, destra) alla portata del pollice. */
:root {
  --bg: #E6ECF0;
  --board: #F8FAFB;
  --grid: #C9D3DB;
  --line: #C3CED7;
  --ink: #14232F;
  --muted: #566774;
  --snake: #2C5B8A;
  --snake-head: #173B61;
  --food: #E8A317;
  --danger: #C8432B;
  --btn: #FFFFFF;
  --zone: #D3DEE6;
  --overlay: rgba(230, 236, 240, 0.88);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151C;
    --board: #15202A;
    --grid: #25343F;
    --line: #2E4150;
    --ink: #E7EEF3;
    --muted: #8DA0AE;
    --snake: #5E9BD6;
    --snake-head: #A8D0FA;
    --food: #F5B83D;
    --danger: #FF7A5C;
    --btn: #1B2833;
    --zone: #2C4152;
    --overlay: rgba(14, 21, 28, 0.88);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C;
  --board: #15202A;
  --grid: #25343F;
  --line: #2E4150;
  --ink: #E7EEF3;
  --muted: #8DA0AE;
  --snake: #5E9BD6;
  --snake-head: #A8D0FA;
  --food: #F5B83D;
  --danger: #FF7A5C;
  --btn: #1B2833;
  --zone: #2C4152;
  --overlay: rgba(14, 21, 28, 0.88);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.app {
  width: 100%;
  max-width: 520px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
header { flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2rem;
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
}
.stats { display: flex; gap: 22px; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.stat span { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat b {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 1.35rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.board {
  position: relative;
  flex: none;
  border-radius: 16px;
  overflow: hidden;
  background: var(--board);
  box-shadow: 0 0 0 1px var(--line);
  touch-action: none;
  cursor: pointer;
}
canvas { display: block; width: 100%; height: 100%; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px;
  text-align: center;
  background: var(--overlay);
}
.ov-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2rem;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
.ov-sub { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 26ch; text-wrap: balance; }

.tools { flex: none; display: flex; gap: 8px; }
.btn {
  flex: 1 1 0;
  min-width: 0;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 8px;
  min-height: 40px;
  cursor: pointer;
  touch-action: manipulation;
  text-align: center;
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }

.pad {
  flex: none;
  position: relative;
  height: clamp(150px, 34dvh, 300px);
  border-radius: 22px;
  background: var(--btn);
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
  touch-action: none;
  cursor: pointer;
}
.z { position: absolute; inset: 0; background: var(--zone); opacity: 0; transition: opacity 0.08s; }
.z.on { opacity: 1; }
.z-up { clip-path: polygon(0 0, 100% 0, 50% 50%); }
.z-down { clip-path: polygon(0 100%, 100% 100%, 50% 50%); }
.z-left { clip-path: polygon(0 0, 0 100%, 50% 50%); }
.z-right { clip-path: polygon(100% 0, 100% 100%, 50% 50%); }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lines line { stroke: var(--line); stroke-width: 1.5; }
.arr { position: absolute; width: 34px; height: 34px; color: var(--ink); opacity: 0.8; pointer-events: none; }
.arr-up { top: 12px; left: 50%; transform: translateX(-50%); }
.arr-down { bottom: 12px; left: 50%; transform: translateX(-50%); }
.arr-left { left: 16px; top: 50%; transform: translateY(-50%); }
.arr-right { right: 16px; top: 50%; transform: translateY(-50%); }

.hint { display: none; flex: none; margin: 0; font-size: 0.82rem; color: var(--muted); text-align: center; }
button:focus-visible { outline: 2px solid var(--snake); outline-offset: 2px; }

@media (pointer: fine) {
  .pad { display: none; }
  .hint { display: block; }
}
</style>
</head>
<body>

<main class="app" id="app">
  <header>
    <h1>Snake</h1>
    <div class="stats">
      <div class="stat"><span>Punti</span><b id="score">0</b></div>
      <div class="stat"><span>Record</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="board" id="board" aria-label="Griglia di gioco">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay">
        <p class="ov-title" id="ovTitle">Pronto?</p>
        <p class="ov-sub" id="ovSub">Tocca la griglia per iniziare</p>
      </div>
    </div>
  </div>

  <div class="tools">
    <button class="btn" id="pauseBtn" type="button" disabled>Pausa</button>
    <button class="btn" id="wrapBtn" type="button">Bordi: muri</button>
    <button class="btn" id="fsBtn" type="button" hidden>Schermo intero</button>
  </div>
  <p class="hint">Frecce o WASD per muoverti, spazio per la pausa. Ogni mela vale 10 punti.</p>

  <div class="pad" id="pad" aria-label="Comandi: tocca sopra, sotto, a sinistra o a destra">
    <div class="z z-up" id="zUp"></div>
    <div class="z z-down" id="zDown"></div>
    <div class="z z-left" id="zLeft"></div>
    <div class="z z-right" id="zRight"></div>
    <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"/>
      <line x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="arr arr-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    <svg class="arr arr-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    <svg class="arr arr-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <svg class="arr arr-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</main>

<script>
(function () {
  var N = 20;
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), canvas = $('cv'), ctx = canvas.getContext('2d');
  var scoreEl = $('score'), bestEl = $('best');
  var overlay = $('overlay'), ovTitle = $('ovTitle'), ovSub = $('ovSub');
  var pauseBtn = $('pauseBtn'), wrapBtn = $('wrapBtn'), fsBtn = $('fsBtn');
  var rootEl = document.documentElement;

  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  var standalone = (window.matchMedia && (window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches)) || window.navigator.standalone === true;
  var canFs = !!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen);
  fsBtn.hidden = !canFs || standalone;
  fsBtn.addEventListener('click', function () {
    if (fsEl()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var req = rootEl.requestFullscreen || rootEl.webkitRequestFullscreen;
      var p = req.call(rootEl);
      if (p && p.catch) p.catch(function () {});
    }
  });
  function onFs() {
    fsBtn.textContent = fsEl() ? 'Riduci' : 'Schermo intero';
    setTimeout(resize, 60);
  }
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);

  var size = 320, dpr = 1;
  var snake, dir, queue, food, score = 0, best = 0;
  var state = 'ready'; // ready | running | paused | over
  var tickMs = 140, acc = 0, lastT = 0, overAt = 0, crashed = false, won = false, wrap = false;

  try {
    best = parseInt(localStorage.getItem('snake.best') || '0', 10) || 0;
    wrap = localStorage.getItem('snake.wrap') === '1';
  } catch (e) {}

  function resize() {
    var full = !!fsEl();
    var cap = full ? 760 : 480;
    $('app').style.maxWidth = (full ? 820 : 520) + 'px';
    var st = $('stage');
    var s = Math.max(N * 8, Math.min(st.clientWidth, st.clientHeight, cap));
    size = Math.floor(s / N) * N;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    board.style.width = size + 'px';
    board.style.height = size + 'px';
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var used = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { used = true; break; }
        }
        if (!used) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tickMs = 140;
    acc = 0;
    crashed = false;
    won = false;
    placeFood();
    state = 'ready';
    refreshUI();
  }

  function start() {
    state = 'running';
    acc = 0;
    lastT = performance.now();
    refreshUI();
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    refreshUI();
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'running';
    acc = 0;
    lastT = performance.now();
    refreshUI();
  }

  function gameOver(didWin) {
    state = 'over';
    won = !!didWin;
    crashed = !didWin;
    overAt = performance.now();
    if (score > best) {
      best = score;
      try { localStorage.setItem('snake.best', String(best)); } catch (e) {}
    }
    try { if (navigator.vibrate && !didWin) navigator.vibrate(60); } catch (e) {}
    refreshUI();
  }

  function primary() {
    if (state === 'ready') start();
    else if (state === 'paused') resume();
    else if (state === 'over' && performance.now() - overAt > 400) { reset(); start(); }
  }

  function setDir(dx, dy) {
    if (state === 'over') {
      if (performance.now() - overAt <= 400) return;
      reset();
      start();
    } else if (state === 'paused') {
      return;
    } else if (state === 'ready') {
      start();
    }
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (dx === last.x && dy === last.y) return;
    if (dx === -last.x && dy === -last.y) return;
    if (queue.length < 2) queue.push({ x: dx, y: dy });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var hx = snake[0].x + dir.x, hy = snake[0].y + dir.y;
    if (wrap) {
      hx = (hx + N) % N;
      hy = (hy + N) % N;
    } else if (hx < 0 || hy < 0 || hx >= N || hy >= N) {
      gameOver(false);
      return;
    }
    var eating = food && hx === food.x && hy === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    for (var i = 0; i < body.length; i++) {
      if (body[i].x === hx && body[i].y === hy) { gameOver(false); return; }
    }
    snake.unshift({ x: hx, y: hy });
    if (eating) {
      score += 10;
      tickMs = Math.max(70, tickMs - 3);
      if (snake.length >= N * N) { food = null; refreshUI(); gameOver(true); return; }
      placeFood();
      refreshUI();
    } else {
      snake.pop();
    }
  }

  function refreshUI() {
    scoreEl.textContent = score;
    bestEl.textContent = Math.max(best, score);
    pauseBtn.disabled = !(state === 'running' || state === 'paused');
    pauseBtn.textContent = state === 'paused' ? 'Riprendi' : 'Pausa';
    wrapBtn.disabled = state === 'running' || state === 'paused';
    wrapBtn.textContent = wrap ? 'Bordi: aperti' : 'Bordi: muri';
    overlay.hidden = state === 'running';
    if (state === 'ready') {
      ovTitle.textContent = 'Pronto?';
      ovSub.textContent = 'Tocca la griglia o un comando per iniziare';
    } else if (state === 'paused') {
      ovTitle.textContent = 'In pausa';
      ovSub.textContent = 'Tocca la griglia per riprendere';
    } else if (state === 'over') {
      ovTitle.textContent = won ? 'Hai vinto!' : 'Fine partita';
      var extra = score >= best && score > 0 ? 'Nuovo record!' : 'Record: ' + best;
      ovSub.textContent = score + ' punti. ' + extra + ' Tocca per rigiocare.';
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(t) {
    var cs = getComputedStyle(document.documentElement);
    var col = function (n) { return cs.getPropertyValue(n).trim(); };
    var c = size / N;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = col('--board');
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = col('--grid');
    for (var gy = 0; gy < N; gy++) {
      for (var gx = 0; gx < N; gx++) {
        ctx.beginPath();
        ctx.arc(gx * c + c / 2, gy * c + c / 2, Math.max(1, c * 0.05), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (food) {
      var pulse = reduceMotion ? 0 : Math.sin(t / 220) * c * 0.04;
      ctx.fillStyle = col('--food');
      ctx.beginPath();
      ctx.arc(food.x * c + c / 2, food.y * c + c / 2, c * 0.3 + pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    var inset = Math.max(1, c * 0.07);
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var isHead = i === 0;
      ctx.fillStyle = isHead ? (crashed ? col('--danger') : col('--snake-head')) : col('--snake');
      rr(s.x * c + inset, s.y * c + inset, c - inset * 2, c - inset * 2, c * 0.3);
      ctx.fill();
    }

    var h = snake[0];
    var cx = h.x * c + c / 2, cy = h.y * c + c / 2;
    var px = -dir.y, py = dir.x;
    ctx.fillStyle = col('--board');
    for (var k = -1; k <= 1; k += 2) {
      ctx.beginPath();
      ctx.arc(cx + dir.x * c * 0.16 + px * k * c * 0.17, cy + dir.y * c * 0.16 + py * k * c * 0.17, c * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(t) {
    if (state === 'running') {
      acc += t - lastT;
      if (acc > 500) acc = 500;
      while (acc >= tickMs && state === 'running') {
        step();
        acc -= tickMs;
      }
    }
    lastT = t;
    draw(t);
    requestAnimationFrame(frame);
  }

  // Swipe e tocco sulla griglia
  var sx = 0, sy = 0, tx = 0, ty = 0, tracking = false, moved = false;
  board.addEventListener('pointerdown', function (e) {
    tracking = true;
    moved = false;
    sx = tx = e.clientX;
    sy = ty = e.clientY;
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
  });
  board.addEventListener('pointermove', function (e) {
    if (!tracking) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) >= 24) {
      moved = true;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      sx = e.clientX;
      sy = e.clientY;
    }
  });
  board.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dist = Math.hypot(e.clientX - tx, e.clientY - ty);
    if (!moved && dist < 10) primary();
  });
  board.addEventListener('pointercancel', function () { tracking = false; });

  // Pad in basso: quattro zone a triangolo, tocco singolo o dito che scivola da una zona all'altra
  var pad = $('pad');
  var zoneEls = { up: $('zUp'), down: $('zDown'), left: $('zLeft'), right: $('zRight') };
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var padActive = false, padZone = null;

  function zoneAt(e) {
    var r = pad.getBoundingClientRect();
    var nx = (e.clientX - r.left) / r.width - 0.5;
    var ny = (e.clientY - r.top) / r.height - 0.5;
    if (Math.abs(nx) > Math.abs(ny)) return nx > 0 ? 'right' : 'left';
    return ny > 0 ? 'down' : 'up';
  }
  function lightZone(name) {
    for (var k in zoneEls) zoneEls[k].classList.toggle('on', k === name);
  }
  function hitPad(e, first) {
    var z = zoneAt(e);
    if (z === padZone && !first) return;
    padZone = z;
    lightZone(z);
    setDir(DIRS[z][0], DIRS[z][1]);
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (err) {}
  }
  function endPad() {
    padActive = false;
    padZone = null;
    lightZone(null);
  }
  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    padActive = true;
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    hitPad(e, true);
  });
  pad.addEventListener('pointermove', function (e) {
    if (padActive) hitPad(e, false);
  });
  pad.addEventListener('pointerup', endPad);
  pad.addEventListener('pointercancel', endPad);

  pauseBtn.addEventListener('click', function () {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
  });
  wrapBtn.addEventListener('click', function () {
    wrap = !wrap;
    try { localStorage.setItem('snake.wrap', wrap ? '1' : '0'); } catch (e) {}
    refreshUI();
  });

  // Tastiera
  var keys = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };
  window.addEventListener('keydown', function (e) {
    if (keys[e.key]) {
      e.preventDefault();
      setDir(keys[e.key][0], keys[e.key][1]);
    } else if (e.key === ' ' || e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      if (state === 'running') pause();
      else primary();
    } else if (e.key === 'p' || e.key === 'P') {
      if (state === 'running') pause();
      else if (state === 'paused') resume();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
